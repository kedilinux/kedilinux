name = "Kedi GNU/Linux"
version = "2026.11.11"
volume_label = "KEDI_LIVE"
hostname = "kedi"
live_user = "kedi"
live_password = ""

components = []
packages = [
    "acl", "attr", "audit", "baselayout", "bash", "bc", "biosdevname", "busybox", "bzip2",
    "ca-certificates", "comar", "comar-api", "coreutils", "cpio", "cracklib", "curl", "db", "dbus",
    "dbus-glib", "dbus-python", "dhcpcd", "diffutils", "duktape", "e2fsprogs", "efivar", "eudev",
    "expat", "file", "findutils", "fuse", "fuse3", "gawk", "gdbm", "gettext", "glib2", "glibc",
    "gperf", "gperftools", "grep", "groff", "gzip", "help2man", "json-c", "kbd", "keyutils", "kmod",
    "less", "leveldb", "libX11", "libXau", "libXdmcp", "libaio", "libbsd", "libcap", "libcap-ng",
    "libee", "libestr", "libfastjson", "libffi", "libgcc", "libgcrypt", "libgpg-error", "libidn",
    "libidn2", "libkmod", "liblogging", "libmd", "libnghttp2", "libnsl", "libpcre", "libpipeline",
    "libquadmath", "libssh2", "libtool-ltdl", "libunistring", "libusb", "libusb-compat", "libuser",
    "libutil-linux", "libxcb", "libxcrypt", "libxml2", "lsb-release", "lz4", "lzo", "mailcap",
    "man-db", "man-pages", "mdadm-static", "mingetty", "miscfiles", "mit-kerberos", "ncompress",
    "ncurses", "net-tools", "nettle", "nspr", "nss-mdns", "openssl", "pam", "pciutils",
    "pcmciautils", "perl", "perl-Locale-gettext", "piksemel", "pisi", "pisilinux-python", "plyvel",
    "polkit", "popt", "procps", "psmisc", "pycurl", "pypolkit", "python", "python-audit",
    "python-psutil", "python-pyliblzma", "python-six", "python3-piksemel", "readline", "rsyslog",
    "run-parts", "sed", "shadow", "snappy", "spidermonkey", "sqlite", "sysfsutils",
    "sysvinit-tools", "tar", "tcp-wrappers", "texinfo", "time", "timezone", "unzip", "urlgrabber",
    "usbutils", "util-linux", "v86d", "vixie-cron", "which", "wireless-tools", "xz", "zip", "zlib",
    "zstd", "kernel", "mkinitcpio", "grub2", "openrc", "kedi-base", "kedi-keyring", "udev-openrc",
    "kmod-openrc", "dhcpcd-openrc", "dbus-openrc", "rsyslog-openrc", "vixie-cron-openrc",
    "envupdate", "systemd-tmpfiles",
    "dosfstools", "efibootmgr", "nano"
]

excluded_packages = []
work_dir = "/build/pisi-iso-creator"
squashfs_compression = "xz"
kernel_cmdline = "console=tty0 console=ttyS0"
live_initramfs = true
output_iso = "/build/kedi-base-2026.11.11-live.iso"

post_install_script = '''
set -e
kver=$(ls /lib/modules | sort -V | tail -n 1)
depmod -a "$kver"
[ -e /etc/init.d/agetty.ttyS0 ] || ln -s agetty /etc/init.d/agetty.ttyS0
for s in devfs dmesg sysfs cgroups kmod-static-nodes systemd-tmpfiles-setup-dev udev udev-trigger; do
    rc-update add "$s" sysinit
done
for s in procfs root localmount fsck swap hostname hwclock modules sysctl bootmisc loopback consolefont keymaps save-keymaps termencoding save-termencoding seedrng systemd-tmpfiles-setup rsyslog envupdate; do
    rc-update add "$s" boot
done
for s in dbus dhcpcd vixie-cron local agetty.tty1 agetty.tty2 agetty.tty3 agetty.tty4 agetty.tty5 agetty.tty6 agetty.ttyS0; do
    rc-update add "$s" default
done
for s in killprocs mount-ro savecache; do
    rc-update add "$s" shutdown
done
install -d -m 1777 /var/spool/mail
sed -i '/^tmpfs[[:space:]]\+\/[[:space:]]/d' /etc/fstab
echo 'agetty_options="--autologin root --noclear"' > /etc/conf.d/agetty.tty1
echo 'agetty_options="--autologin root"' > /etc/conf.d/agetty.ttyS0
cat > /etc/issue <<'EOF'
Welcome to \S{PRETTY_NAME}!

  ^ ^
 =   =

\r (\l)

EOF
'''

[[repositories]]
name = "kedi"
url = "https://repo.kedilinux.org/1/pisi-index.xml.xz"

[[repositories]]
name = "pisi-2.0"
url = "https://stable2.pisilinux.org/pisi-index.xml.xz"
